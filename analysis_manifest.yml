analysis_version: "2026-06-submission"
unit_of_analysis: "hospital admission linked to ED presentation"
rfv_taxonomy:
  category_system: "current package NHAMCS RFV categories"
  no_new_granular_categories: true
  no_new_composite_chief_concern_categories: true
  multi_label_allowed: true
  first_priority_sensitivity: true
hypercapnia_evidence:
  broad_definition: "ICD-positive OR qualifying gas at any time after ED anchor through discharge"
  abg_pco2_threshold_mmhg: 45
  vbg_pco2_threshold_mmhg: 50
  unknown_pco2_threshold_mmhg: 50
  early_windows_hours: [6, 24]
acid_base:
  ph_bands: ["<7.20", "7.20-7.24", "7.25-7.29", "7.30-7.34", "7.35-7.44", ">=7.45"]
  hco3_bands_mmol_l: ["<22", "22-27", "28-33", ">=34"]
  figure4_primary_ph_rule: "paired qualifying-gas pH when exported by the cohort stage"
  hco3_primary_rule: "first_hco3 analysis-stage field with source and QC flag; same-specimen HCO3 requires future cohort-stage rerun"
sensitivity_analyses:
  first_admission_only: true
  timing_safeguard_6h_24h: true
  abg_only: true
  vbg_only: true
  exclude_unknown_gas: true
  icd10_era: true
  administrative_only_exclusion: true
  first_priority_rfv: true
  stricter_pco2_thresholds: true
models:
  new_regression_models: false
  new_prediction_models: false
scope_exclusions:
  - "No new chief-concern subcategories"
  - "No injuries/adverse-effects splitting"
  - "No nervous-system RFV splitting"
  - "No causal attribution model"
